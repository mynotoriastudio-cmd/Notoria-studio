name: LangGraph Gate

on:
  push:
    branches:
      - feature/langgraph-langchain-gate
      - aspar-shared-memory
  pull_request:
    branches:
      - aspar-shared-memory
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]"

      - name: Run tests
        run: python -m pytest -q

      - name: Run smoke test
        run: python -m aspar_agent.smoke
